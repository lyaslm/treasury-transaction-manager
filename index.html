<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Treasury Transaction Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Treasury Transaction Manager</h1>

      <!-- Control Panel -->
      <div class="controls">
        <div class="control-group">
          <label>Sort By:</label>
          <select id="sortField">
            <option value="amount">Amount</option>
            <option value="date">Date</option>
            <option value="customer">Customer</option>
          </select>
          <select id="sortAlgorithm">
            <option value="bubble">Bubble Sort (Simple)</option>
            <option value="quick">Quick Sort (Efficient)</option>
          </select>
          <button id="sortBtn">Sort Transactions</button>
        </div>

        <div class="control-group">
          <label>Search Type:</label>
          <select id="searchType">
            <option value="linear">Linear Search (Customer)</option>
            <option value="binary">Binary Search (ID)</option>
          </select>
          <input type="text" id="searchInput" placeholder="Enter query..." />
          <button id="searchBtn">Search</button>
          <button id="resetBtn">Reset</button>
        </div>
      </div>

      <!-- Transaction Table -->
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Amount ($)</th>
            <th>Date</th>
            <th>Type</th>
          </tr>
        </thead>
        <tbody id="transactionTableBody">
          <!-- Data will be injected here via JS -->
        </tbody>
      </table>
    </div>

    <script src="app.js"></script>
  </body>
</html>
